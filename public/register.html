<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ShopZone</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><i class="fas fa-shopping-bag"></i> Shop<span>Zone</span></a>
      <nav class="nav-links">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-user-plus"></i>
        <h2>Create Account</h2>
        <p>Join ShopZone today</p>
      </div>
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="name"><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="phone"><i class="fas fa-phone"></i> Phone (optional)</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        </div>
        <div class="form-group">
          <label for="address"><i class="fas fa-map-marker-alt"></i> Address (optional)</label>
          <textarea id="address" name="address" placeholder="Enter your address" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>
      <div class="auth-footer">
        <p>Already have an account? <a href="/login.html">Log In</a></p>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (getToken()) window.location.href = '/';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

      try {
        const res = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
          }),
        });

        if (res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast('Account created successfully! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/', 1000);
        }
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    });

    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = input.nextElementSibling.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
